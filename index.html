<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes Ventes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2a7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Ventes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2fb;--card:#fff;--ink:#0e1a3a;--mut:#5b6785;--line:#dde4f3;--acc:#1c4fd8;--acc2:#b8891b;--bad:#d64545;--sh:0 10px 30px rgba(20,20,30,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b1a;--card:#0f1836;--ink:#eef2ff;--mut:#8f9bbd;--line:#1f2c57;--acc:#4f8bff;--acc2:#f2c14e;--bad:#ff6b6b;--sh:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#060b1a;--card:#0f1836;--ink:#eef2ff;--mut:#8f9bbd;--line:#1f2c57;--acc:#4f8bff;--acc2:#f2c14e;--bad:#ff6b6b;--sh:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
.w{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:26px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--acc2)}
.sub{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;white-space:nowrap}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.k small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.k b{display:block;font-size:22px;margin-top:4px;letter-spacing:-.5px}
.k.hero{background:linear-gradient(135deg,#0a2a7a,#1c4fd8);color:#fff;border:0;box-shadow:inset 0 0 0 1px rgba(242,193,78,.6),var(--sh)}.k.hero b{color:#f7d67a}
.k.hero small{color:rgba(255,255,255,.75)}
.k .pos{color:var(--acc2)}.k .neg{color:var(--bad)}
h2{font-size:16px;margin:26px 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.p h3{margin:0;font-size:16px}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.tag.low{color:var(--bad);border-color:var(--bad)}
.meta{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.price{font-weight:700;color:var(--acc2)}
.act,.act2{display:grid;gap:6px}.act{grid-template-columns:76px 1fr}.act2{grid-template-columns:1fr 1fr auto}.btn.gold{background:var(--acc2);color:#0a1330}.tag.gd{color:var(--acc2);border-color:var(--acc2)}.mg{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.mg b{color:var(--acc2)}.ph{position:relative;aspect-ratio:4/3;border-radius:12px;background:var(--bg);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;font-size:34px}.ph img{width:100%;height:100%;object-fit:cover;display:block}.chg{position:absolute;right:8px;bottom:8px;background:var(--acc2);color:#0a1330;border-radius:99px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;cursor:pointer;box-shadow:var(--sh)}.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg)}.rate{display:flex;align-items:center;gap:5px;font-size:12px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border:0}
.mut{color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:22px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:700px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}.form .btn{grid-column:1/-1}}
</style>
</head>
<body>
<div class="w">
<header>
  <div><h1>Mes <span>Ventes</span></h1><div class="sub" id="date"></div></div>
  <div class="row">
    <div class="seg" id="seg"><button data-p="day">Aujourd'hui</button><button data-p="month">Ce mois</button><button data-p="all" class="on">Tout</button></div>
    <div class="seg" id="cs"><button data-c="GHS">₵ GHS</button><button data-c="USD">$ USD</button></div><label class="rate mut">1 $ = <input id="rate" type="number" step="any" min="0" style="width:74px;padding:6px 8px"> ₵</label>
    <button class="btn g" id="th" title="Thème">◐</button>
  </div>
</header>

<div class="kpis" id="kpis"></div>

<h2>Ajouter un produit</h2>
<div class="panel"><div class="form">
  <input id="n" placeholder="Nom du produit">
  <input id="c" type="number" min="0" step="any" placeholder="Prix d'achat">
  <input id="pv" type="number" min="0" step="any" placeholder="Prix de vente">
  <input id="s" type="number" min="0" step="1" placeholder="Stock">
  <button class="btn gold" id="add">Ajouter</button>
</div>
<div class="row" style="margin-top:10px"><label class="btn g" for="img">📷 Photo du produit</label><input id="img" type="file" accept="image/*" hidden><img id="prev" class="thumb" alt="" hidden><span class="mut" id="imgn"></span></div></div>

<h2>Mes produits</h2>
<div class="grid" id="prods"></div>

<div class="row" style="justify-content:space-between;margin-top:26px"><h2 style="margin:0">Historique des ventes</h2><div class="row"><button class="btn g" id="csv">Exporter CSV</button><button class="btn g" id="bk">Sauvegarde ⬇</button><label class="btn g" for="imp">Importer ⬆</label><input id="imp" type="file" accept=".json,application/json" hidden></div></div>
<div class="panel list" id="hist" style="margin-top:10px"></div>
</div>
<div id="toast"></div>

<script>
const K='mes_ventes_v1';
let S={cur:'GHS',rate:11.5,products:[],sales:[]},per='all',armed=null;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.cur!=='USD')S.cur='GHS';if(!(S.rate>0))S.rate=11.5;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('Stockage plein : photo trop lourde ou trop nombreuse');return false}};
const imgOf=id=>{const p=S.products.find(x=>x.id===id);return p&&p.img?`<img class="thumb" src="${p.img}" alt="">`:''};
const shrink=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const i=new Image();i.onerror=ko;i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};i.src=r.result};r.readAsDataURL(f)});
let newImg='';
async function saveFile(name,blob){try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==='declined')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){toast('Export impossible')}}
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=()=>S.cur==='USD',sym=()=>usd()?'$':'₵';
const cv=n=>usd()?n/S.rate:n,inv=v=>usd()?v*S.rate:v;
const fmt=n=>(n<0?'−':'')+sym()+new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Math.abs(cv(n)));
const sold=p=>S.sales.filter(s=>s.pid===p.id).reduce((a,s)=>a+s.qty,0),gain=p=>S.sales.filter(s=>s.pid===p.id).reduce((a,s)=>a+s.qty*(s.price-s.cost),0);
const uid=()=>Math.random().toString(36).slice(2,9);
const inPer=ts=>{const d=new Date(ts),n=new Date();return per==='day'?d.toDateString()===n.toDateString():per==='month'?(d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()):true};
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

function render(){
  $('date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('rate').value=S.rate;document.querySelectorAll('#cs button').forEach(b=>b.classList.toggle('on',b.dataset.c===S.cur));
  $('c').placeholder="Prix d'achat ("+sym()+")";$('pv').placeholder="Prix de vente ("+sym()+")";
  const ss=S.sales.filter(s=>inPer(s.ts));
  const ca=ss.reduce((a,s)=>a+s.qty*s.price,0),cg=ss.reduce((a,s)=>a+s.qty*s.cost,0),ben=ca-cg,mg=ca?ben/ca*100:0,u=ss.reduce((a,s)=>a+s.qty,0),stk=S.products.reduce((a,p)=>a+p.stock*p.cost,0),pot=S.products.reduce((a,p)=>a+p.stock*(p.price-p.cost),0);
  $('kpis').innerHTML=`<div class="k hero"><small>Chiffre d'affaires</small><b>${fmt(ca)}</b></div><div class="k"><small>Coût d'achat des ventes</small><b>${fmt(cg)}</b></div><div class="k"><small>Bénéfice net</small><b class="${ben>=0?'pos':'neg'}">${fmt(ben)}</b></div><div class="k"><small>Marge</small><b>${mg.toFixed(1)}%</b></div><div class="k"><small>Articles vendus</small><b>${u}</b></div><div class="k"><small>Stock (valeur d'achat)</small><b>${fmt(stk)}</b></div><div class="k"><small>Bénéfice potentiel du stock</small><b class="pos">${fmt(pot)}</b></div>`;
  $('prods').innerHTML=S.products.length?S.products.map(p=>`<div class="p"><div class="ph">${p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:'<span>📦</span>'}<label class="chg" title="Changer la photo">📷<input type="file" accept="image/*" hidden data-img="${p.id}"></label></div><div class="meta"><div><h3>${esc(p.name)}</h3><div class="mut">Achat ${fmt(p.cost)}</div></div><div class="price">${fmt(p.price)}</div></div>
    <div class="mg"><span>Marge / unité <b>${fmt(p.price-p.cost)}</b></span><span>${p.price?Math.round((p.price-p.cost)/p.price*100):0}%</span></div>
    <div><span class="tag ${p.stock<=3?'low':''}">Stock : ${p.stock}</span> <span class="tag">Vendus : ${sold(p)}</span> <span class="tag gd">Gain : ${fmt(gain(p))}</span></div>
    <div class="act"><input id="q-${p.id}" type="number" min="1" value="1" aria-label="Quantité" title="Quantité"><input id="pr-${p.id}" type="number" min="0" step="any" value="${+cv(p.price).toFixed(2)}" aria-label="Prix de vente unitaire" title="Prix de vente unitaire"></div><div class="act2"><button class="btn" data-a="sell" data-id="${p.id}">Vendu ✓</button><button class="btn g" data-a="stock" data-id="${p.id}">+ Stock</button><button class="btn d" data-a="del" data-id="${p.id}">${armed===p.id?'Sûr ?':'✕'}</button></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Aucun produit pour l\'instant. Ajoute le premier ci-dessus.</div>';
  const h=[...S.sales].reverse().slice(0,60);
  $('hist').innerHTML=h.length?h.map(s=>`<div class="it"><div class="row" style="flex-wrap:nowrap">${imgOf(s.pid)}<div><b>${esc(s.name)}</b> × ${s.qty}<div class="mut">${new Date(s.ts).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div></div><div class="row"><div style="text-align:right"><b>${fmt(s.qty*s.price)}</b><div class="mut">+${fmt(s.qty*(s.price-s.cost))}</div></div><button class="btn g" data-a="undo" data-id="${s.id}" title="Annuler cette vente">↺</button></div></div>`).join(''):'<div class="empty">Aucune vente enregistrée.</div>';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===per));
}

$('add').onclick=()=>{
  const name=$('n').value.trim(),cost=inv(+$('c').value||0),price=inv(+$('pv').value),stock=parseInt($('s').value)||0;
  if(!name||!(price>=0)||$('pv').value==='')return toast('Nom et prix de vente requis');
  S.products.push({id:uid(),name,cost,price,stock,img:newImg});
  if(!save()){S.products.pop();return}
  ['n','c','pv','s','img'].forEach(i=>$(i).value='');newImg='';$('prev').hidden=true;$('imgn').textContent='';render();toast('Produit ajouté');
};
$('img').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{newImg=await shrink(f);$('prev').src=newImg;$('prev').hidden=false;$('imgn').textContent=f.name}catch(x){toast('Image illisible')}};
$('prods').onchange=async e=>{const id=e.target.dataset.img,f=e.target.files&&e.target.files[0];if(!id||!f)return;const p=S.products.find(x=>x.id===id);if(!p)return;
  try{const old=p.img;p.img=await shrink(f);if(!save())p.img=old;else toast('Photo mise à jour');render()}catch(x){toast('Image illisible')}};
$('prods').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const p=S.products.find(x=>x.id===b.dataset.id);if(!p)return;
  const q=Math.max(1,parseInt($('q-'+p.id).value)||1),pri=$('pr-'+p.id),sp=pri.value===pri.defaultValue?p.price:inv(+pri.value);
  if(b.dataset.a==='sell'){
    if(q>p.stock)return toast('Stock insuffisant ('+p.stock+' restant)');
    if(!(sp>=0))return toast('Prix invalide');
    p.stock-=q;S.sales.push({id:uid(),pid:p.id,name:p.name,qty:q,price:sp,cost:p.cost,ts:Date.now()});
    toast('Vente enregistrée : '+q+' × '+p.name);
  }else if(b.dataset.a==='stock'){p.stock+=q;toast('+'+q+' en stock')}
  else if(b.dataset.a==='del'){
    if(armed!==p.id){armed=p.id;render();setTimeout(()=>{armed=null;render()},3000);return}
    S.products=S.products.filter(x=>x.id!==p.id);armed=null;toast('Produit supprimé');
  }
  save();render();
};
$('hist').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const s=S.sales.find(x=>x.id===b.dataset.id);if(!s)return;
  const p=S.products.find(x=>x.id===s.pid);if(p)p.stock+=s.qty;
  S.sales=S.sales.filter(x=>x.id!==s.id);save();render();toast('Vente annulée, stock rétabli');
};
$('seg').onclick=e=>{const b=e.target.closest('button');if(b){per=b.dataset.p;render()}};
$('cs').onclick=e=>{const b=e.target.closest('button');if(b){S.cur=b.dataset.c;save();render()}};
$('rate').onchange=e=>{const v=parseFloat(e.target.value);if(v>0){S.rate=v;save();toast('Taux mis à jour')}render()};
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
$('csv').onclick=async()=>{
  if(!S.sales.length)return toast('Rien à exporter');
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['Date','Produit','Quantité','Prix de vente '+S.cur,'Prix d\'achat '+S.cur,'Total '+S.cur,'Bénéfice '+S.cur].join(';')].concat(S.sales.map(s=>[new Date(s.ts).toLocaleString('fr-FR'),q(s.name),s.qty,...[s.price,s.cost,s.qty*s.price,s.qty*(s.price-s.cost)].map(v=>cv(v).toFixed(2))].join(';')));
  saveFile('mes-ventes.csv',new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));
};
$('bk').onclick=()=>saveFile('sauvegarde-ventes-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({app:'mes-ventes',v:1,data:S})],{type:'application/json'}));
$('imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const okid=v=>typeof v==='string'&&/^[a-z0-9]{1,16}$/.test(v),num=v=>Number.isFinite(+v)?+v:0,okimg=v=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(v||'');
  try{const j=JSON.parse(await f.text()),d=j&&j.data;if(!d||!Array.isArray(d.products)||!Array.isArray(d.sales))throw 0;
    const ids=new Set(S.products.map(p=>p.id)),sid=new Set(S.sales.map(x=>x.id));let np=0,ns=0;
    d.products.forEach(p=>{if(p&&okid(p.id)&&!ids.has(p.id)){S.products.push({id:p.id,name:String(p.name||'').slice(0,80),cost:num(p.cost),price:num(p.price),stock:Math.max(0,parseInt(p.stock)||0),img:okimg(p.img)?p.img:''});np++}});
    d.sales.forEach(x=>{if(x&&okid(x.id)&&okid(x.pid)&&!sid.has(x.id)){S.sales.push({id:x.id,pid:x.pid,name:String(x.name||'').slice(0,80),qty:Math.max(1,parseInt(x.qty)||1),price:num(x.price),cost:num(x.cost),ts:num(x.ts)||Date.now()});ns++}});
    S.sales.sort((a,b)=>a.ts-b.ts);
    if(d.cur==='USD'||d.cur==='GHS')S.cur=d.cur;if(d.rate>0)S.rate=+d.rate;
    if(save()){render();toast(np+' produit(s) et '+ns+' vente(s) importés')}
  }catch(x){toast('Fichier de sauvegarde invalide')}};
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
